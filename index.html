<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#050505" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>DISTORTION FIELD</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main id="app">
    <video id="camera" playsinline muted></video>
    <canvas id="stage"></canvas>

    <section id="permission" class="permission-panel" aria-label="Launch Distortion Field">
      <canvas id="vortexCanvas" class="vortex-canvas" aria-hidden="true"></canvas>
      <div class="permission-copy">
        <h1>DISTORTION<br />FIELD</h1>
        <p>BY YSSEM LAB</p>
        <button id="startCamera" type="button">ENTER</button>
      </div>
    </section>

    <section id="controls" class="controls" aria-label="Distortion controls">
      <button id="toggleControls" class="controls-toggle" type="button" aria-expanded="true" aria-controls="controlsBody">
        <span>CONTROLS</span>
        <span class="controls-summary"><b id="currentModeLabel">BEND</b><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5 7.5 5 5 5-5" /></svg></span>
      </button>

      <div id="controlsBody" class="controls-body">
        <div class="mode-row" role="group" aria-label="Distortion mode">
          <button type="button" class="mode active" data-mode="0">BEND</button>
          <button type="button" class="mode" data-mode="1">BULGE</button>
          <button type="button" class="mode" data-mode="2">TWIST</button>
          <button type="button" class="mode" data-mode="3">WAVE</button>
        </div>

        <div class="slider-grid">
          <label>
            <span>STRENGTH <output id="strengthValue">0.24</output></span>
            <input id="strength" type="range" min="0" max="1" step="0.01" value="0.24" />
          </label>
          <label>
            <span>RADIUS <output id="radiusValue">0.42</output></span>
            <input id="radius" type="range" min="0.08" max="1" step="0.01" value="0.42" />
          </label>
          <label>
            <span>FREQUENCY <output id="frequencyValue">4.0</output></span>
            <input id="frequency" type="range" min="0.5" max="12" step="0.1" value="4" />
          </label>
        </div>

        <div class="utility-row">
          <button id="randomize" type="button">RANDOM</button>
          <button id="before" type="button">HOLD BEFORE</button>
          <button id="reset" type="button">RESET</button>
        </div>
      </div>
    </section>

    <section class="capture-dock" aria-label="Camera controls">
      <div id="recordingBadge" class="recording-badge" hidden>
        <i></i><span id="recordingTime">00:00</span>
      </div>

      <div class="capture-mode" role="group" aria-label="Capture mode">
        <button id="photoMode" type="button" class="active">PHOTO</button>
        <button id="videoMode" type="button">VIDEO</button>
      </div>

      <div class="capture-row">
        <button id="openLast" class="round-action" type="button" aria-label="Open last capture" disabled>
          <span id="lastThumb">LAST</span>
        </button>

        <button id="shutter" class="shutter photo" type="button" aria-label="Take photo">
          <span></span>
        </button>

        <button id="switchCamera" class="round-action switch-camera" type="button" aria-label="Switch camera">
          <svg viewBox="0 0 32 32" aria-hidden="true">
            <path d="M7.2 12.1A10.2 10.2 0 0 1 23.6 8.8l2.1 2.1" />
            <path d="M25.7 5.9v5.4h-5.4" />
            <path d="M24.8 19.9A10.2 10.2 0 0 1 8.4 23.2l-2.1-2.1" />
            <path d="M6.3 26.1v-5.4h5.4" />
          </svg>
        </button>
      </div>
    </section>

    <section id="preview" class="preview" hidden aria-label="Captured media preview">
      <div class="preview-head">
        <div>
          <strong id="previewTitle">CAPTURED</strong>
          <span id="previewMeta"></span>
        </div>
        <button id="closePreview" class="icon-button" type="button" aria-label="Close preview">×</button>
      </div>
      <div id="previewFrame" class="preview-frame"></div>
      <div class="preview-actions">
        <button id="saveSharePreview" class="primary" type="button">SAVE/SHARE</button>
      </div>
    </section>

    <div id="flash" class="flash" aria-hidden="true"></div>
    <div id="status" class="status" role="status" aria-live="polite"></div>
  </main>

  <script type="module" src="main.js"></script>
</body>
</html>
